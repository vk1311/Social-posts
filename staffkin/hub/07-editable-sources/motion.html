<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Outfit; font-weight: 400; src: url(fonts/outfit-latin-400-normal.woff2); }
@font-face { font-family: Outfit; font-weight: 500; src: url(fonts/outfit-latin-500-normal.woff2); }
@font-face { font-family: Outfit; font-weight: 600; src: url(fonts/outfit-latin-600-normal.woff2); }
@font-face { font-family: Outfit; font-weight: 700; src: url(fonts/outfit-latin-700-normal.woff2); }
:root { --indigo:#2E2A6B; --peri:#7B8CF5; --peri-soft:#E3E7FE; --paper:#F5F6FC; --ink:#23213F; --muted:#6B6890; --line:#E4E6F2; --good:#1F8A5B; --good-soft:#DDF3E8; --warn:#B7791F; --warn-soft:#FDF1D8; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--paper); font-family: Outfit, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; background: var(--paper); }
.abs { position: absolute; }
.bgrings { position: absolute; opacity: .08; }
/* captions */
.cap { position: absolute; font-weight: 700; color: var(--indigo); letter-spacing: -.02em; line-height: 1.08; }
.cap em { font-style: normal; color: var(--peri); }
.cap .w { display: inline-block; will-change: transform; }
.sub { position: absolute; font-weight: 500; color: var(--muted); }
/* papers */
.sheet { position: absolute; background: #fff; border-radius: 10px; box-shadow: 0 18px 40px -18px rgba(35,33,63,.45), 0 2px 6px rgba(35,33,63,.08); padding: 26px 24px; }
.sheet .l { height: 12px; border-radius: 6px; background: #E6E7EF; margin-bottom: 12px; }
.sheet .h { height: 18px; width: 55%; border-radius: 6px; background: #C9CBDD; margin-bottom: 20px; }
.sheet .box { display:flex; gap:10px; align-items:center; margin-bottom: 12px; }
.sheet .box i { width: 18px; height: 18px; border: 2px solid #C9CBDD; border-radius: 4px; flex: none; }
.sheet .box b { height: 10px; border-radius: 5px; background: #E6E7EF; flex: 1; }
.sticky { position: absolute; padding: 22px; font-weight: 600; font-size: 30px; color: #5b4a00; box-shadow: 0 16px 30px -16px rgba(35,33,63,.5); line-height: 1.15; }
/* panel (app window) */
#panelWrap { position: absolute; transform-origin: 0 0; }
.chrome { height: 46px; background: #ECEEF7; border-radius: 22px 22px 0 0; display: flex; align-items: center; gap: 9px; padding: 0 18px; border: 1px solid var(--line); border-bottom: 0; }
.chrome i { width: 13px; height: 13px; border-radius: 50%; background: #D4D6E6; }
.chrome .url { margin-left: 16px; background: #fff; border-radius: 8px; height: 28px; flex: 1; display: flex; align-items: center; padding: 0 14px; font-size: 16px; color: var(--muted); }
#panel { position: relative; background: #fff; border-radius: 28px; box-shadow: 0 40px 90px -40px rgba(46,42,107,.45), 0 4px 14px rgba(46,42,107,.06); overflow: hidden; border: 1px solid var(--line); }
.yt #panel { border-radius: 0 0 22px 22px; }
.apphead { position: absolute; left: 0; right: 0; top: 0; height: 64px; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 32px; gap: 26px; font-size: 18px; }
.apphead .brand { display: flex; align-items: center; gap: 9px; font-size: 23px; font-weight: 500; color: var(--indigo); }
.apphead .nav { color: var(--muted); } .apphead .nav.on { color: var(--indigo); background: var(--peri-soft); padding: 6px 12px; border-radius: 8px; }
.apphead .pill { margin-left: auto; background: var(--indigo); color: #fff; font-size: 15px; font-weight: 600; padding: 6px 13px; border-radius: 999px; }
.scene { position: absolute; left: 0; top: 64px; right: 0; bottom: 0; overflow: hidden; }
.h1 { position: absolute; font-size: 40px; font-weight: 700; color: var(--indigo); letter-spacing: -.02em; }
.muted { color: var(--muted); }
.label { position: absolute; font-size: 18px; font-weight: 600; color: var(--muted); }
.input { position: absolute; height: 64px; border: 2px solid var(--line); border-radius: 14px; font-size: 26px; display: flex; align-items: center; padding: 0 20px; background: #fff; }
.input.focus { border-color: var(--peri); box-shadow: 0 0 0 4px var(--peri-soft); }
.caret { display: inline-block; width: 2px; height: 30px; background: var(--indigo); margin-left: 2px; }
.check { width: 30px; height: 30px; border-radius: 8px; background: var(--indigo); display: grid; place-items: center; flex: none; }
.btn { position: absolute; display: grid; place-items: center; border-radius: 14px; font-weight: 600; font-size: 24px; background: var(--indigo); color: #fff; }
.card { position: absolute; background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 14px 30px -20px rgba(46,42,107,.35); display: flex; align-items: center; gap: 20px; padding: 0 26px; }
.ico { width: 58px; height: 58px; border-radius: 14px; background: var(--peri-soft); display: grid; place-items: center; flex: none; }
.card .t { font-size: 25px; font-weight: 600; color: var(--indigo); }
.card .s { font-size: 18px; color: var(--muted); margin-top: 2px; }
.tick { margin-left: auto; width: 40px; height: 40px; border-radius: 50%; background: var(--good-soft); display: grid; place-items: center; flex: none; }
.av { width: 54px; height: 54px; border-radius: 50%; background: var(--peri-soft); color: var(--indigo); display: grid; place-items: center; font-weight: 600; font-size: 20px; flex: none; }
.chip { margin-left: auto; font-size: 17px; font-weight: 600; padding: 8px 14px; border-radius: 999px; white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); } .chip.warn { background: var(--warn-soft); color: var(--warn); }
.tabs { position: absolute; display: flex; gap: 8px; font-size: 18px; }
.tabs span { padding: 8px 14px; border-radius: 10px; color: var(--muted); } .tabs span.on { background: var(--peri-soft); color: var(--indigo); font-weight: 600; }
.qcard { position: absolute; border: 1px solid var(--line); border-radius: 22px; padding: 30px 34px; background: #fff; box-shadow: 0 20px 40px -26px rgba(46,42,107,.4); }
.tag { font-size: 15px; font-weight: 700; letter-spacing: .08em; color: var(--peri); }
.qtext { font-size: 30px; font-weight: 500; line-height: 1.3; margin: 10px 0 18px; }
.anch { background: var(--paper); border-radius: 14px; padding: 14px 18px; font-size: 19px; display: grid; gap: 6px; }
.anch b { color: var(--indigo); display: inline-block; width: 92px; }
.scores { display: flex; gap: 16px; margin-top: 22px; }
.scores span { width: 62px; height: 62px; border-radius: 50%; border: 2px solid #D5D7E6; display: grid; place-items: center; font-size: 24px; color: var(--muted); }
.table { position: absolute; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: #fff; }
.trow { position: absolute; left: 0; right: 0; height: 96px; display: flex; align-items: center; padding: 0 26px; gap: 18px; font-size: 22px; border-bottom: 1px solid var(--line); background: #fff; }
.thead .col-a { font-size: 16px; } .thead { height: 58px; background: var(--paper); font-size: 16px; font-weight: 700; color: var(--indigo); letter-spacing: .02em; }
.col-n { width: 290px; display: flex; align-items: center; gap: 14px; } .col-a { width: 150px; font-weight: 700; color: var(--indigo); font-size: 30px; } .col-s { width: 130px; color: var(--muted); } .col-r { flex: 1; }
.reel .col-s { display: none; } .reel .col-n { width: 230px; } .reel .col-a { width: 120px; }
.bar { height: 10px; border-radius: 5px; background: var(--peri-soft); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--peri); }
.step { position: absolute; display: flex; align-items: center; gap: 18px; font-size: 24px; }
.dot { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #D5D7E6; display: grid; place-items: center; flex: none; }
.pdf { position: absolute; display: flex; align-items: center; gap: 18px; background: var(--indigo); color: #fff; border-radius: 18px; padding: 20px 26px; box-shadow: 0 24px 40px -18px rgba(46,42,107,.6); }
.pdf .doc { width: 50px; height: 62px; background: #fff; border-radius: 6px; position: relative; } .pdf .doc::after { content: "PDF"; position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 700; color: #C0392B; }
.status { position: absolute; font-size: 22px; font-weight: 700; padding: 10px 20px; border-radius: 999px; }
.progress { position: absolute; height: 14px; border-radius: 7px; background: var(--peri-soft); overflow: hidden; } .progress i { display: block; height: 100%; background: var(--good); }
.role { position: absolute; width: 280px; height: 84px; border: 1px solid var(--line); border-radius: 14px; background: #fff; padding: 14px 18px; }
.role b { display: block; font-size: 21px; font-weight: 600; color: var(--indigo); } .role span { font-size: 15px; color: var(--muted); }
/* cursor */
#cursor { position: absolute; width: 40px; height: 40px; z-index: 50; }
#ripple { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 4px solid var(--peri); z-index: 49; }
/* end card */
#end { position: absolute; inset: 0; background: var(--indigo); }
#end .tl { position: absolute; left: 0; right: 0; text-align: center; color: #fff; font-weight: 700; letter-spacing: -.02em; line-height: 1.05; }
#end .tl em { font-style: normal; color: #AEB8FF; }
#end .cta { position: absolute; left: 50%; background: var(--peri); color: #fff; font-weight: 700; border-radius: 999px; display: grid; place-items: center; }
#end .url { position: absolute; left: 0; right: 0; text-align: center; color: #fff; font-weight: 500; }
#end .ns { position: absolute; left: 0; right: 0; text-align: center; color: #B9BCE6; font-weight: 500; }
</style></head>
<body><div id="stage"></div>
<script>
const FORMAT = new URLSearchParams(location.search).get('f') || 'reel';
const REEL = FORMAT === 'reel';
const W = REEL ? 1080 : 1920, H = REEL ? 1920 : 1080;
document.body.classList.add(REEL ? 'reel' : 'yt');
const stage = document.getElementById('stage');

// ---------- easing helpers (everything is a pure function of time t, so any frame can be rendered) ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, d) => clamp((t - a) / d);
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = (x) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const el = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; };
const set = (e, o, tf) => { e.style.opacity = o; if (tf !== undefined) e.style.transform = tf; };

const RINGS = (sw = 4, c1 = '#2E2A6B', c2 = '#7B8CF5') => `<svg viewBox="3 8 34 24" width="100%" height="100%"><circle cx="15" cy="20" r="10" fill="none" stroke="${c1}" stroke-width="${sw}"/><circle cx="25" cy="20" r="10" fill="none" stroke="${c2}" stroke-width="${sw}"/></svg>`;
const ICON = {
  doc: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2E2A6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>',
  clip: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2E2A6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>',
  chart: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2E2A6B" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-6M22 20H2"/></svg>',
  ok: (c = '#1F8A5B', s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>`,
  dl: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>',
};

// ---------- timeline ----------
const S = REEL
  ? { hook: [0, 2.5], logo: [2.3, 4.6], job: [4.4, 8.6], pre: [8.4, 12.4], score: [12.2, 16.8], refs: [16.6, 20.8], hired: [20.6, 23.1], end: [22.9, 26] }
  : { hook: [0, 3.2], logo: [3.0, 6.2], job: [6.0, 12.2], pre: [12.0, 17.2], score: [17.0, 23.6], refs: [23.4, 29.6], hired: [29.4, 33.6], tpl: [33.4, 39.2], end: [39.0, 45] };
const DUR = REEL ? 26 : 45;
window.DUR = DUR;
const vis = (t, [a, b], fin = .35, fout = .3) => Math.min(seg(t, a, fin), 1 - seg(t, b - fout, fout));

// ---------- background rings ----------
const bg1 = el(`<div class="bgrings">${RINGS(3)}</div>`); stage.appendChild(bg1);

// ---------- HOOK: paper pile ----------
const pile = el('<div class="abs" style="inset:0"></div>'); stage.appendChild(pile);
const k = REEL ? 1.25 : .82;
const PC = REEL ? { x: 540, y: 1150 } : { x: 960, y: 700 };
const notes = ['call back?', 'refs??', 'Tues 3pm', 'which one was Sam?', 'TD1 form', 'lost resume'];
const papers = [];
for (let i = 0; i < 17; i++) {
  const sticky = i % 3 === 2;
  let node;
  if (sticky) {
    const col = ['#FFE58A', '#FFC9D6', '#C9F0D8'][Math.floor(i / 3) % 3];
    node = el(`<div class="sticky" style="width:${230 * k}px;height:${230 * k}px;background:${col};font-size:${30 * k}px">${notes[Math.floor(i / 3) % notes.length]}</div>`);
  } else {
    const form = i % 2;
    const inner = form ? '<div class="h"></div>' + '<div class="box"><i></i><b></b></div>'.repeat(7)
                       : '<div class="h"></div>' + Array.from({ length: 11 }, (_, j) => `<div class="l" style="width:${[92, 80, 96, 60, 88, 94, 70, 85, 90, 64, 78][j]}%"></div>`).join('');
    node = el(`<div class="sheet" style="width:${340 * k}px;height:${440 * k}px">${inner}</div>`);
  }
  const rnd = (n) => { const x = Math.sin(i * 12.9898 + n * 78.233) * 43758.5453; return x - Math.floor(x); };
  const w = sticky ? 230 * k : 340 * k, h = sticky ? 230 * k : 440 * k;
  const spreadX = REEL ? 360 : 640, spreadY = REEL ? 380 : 180;
  papers.push({ node, w, h, x: PC.x + (rnd(1) - .5) * spreadX - w / 2, y: PC.y + (rnd(2) - .5) * spreadY - h / 2, r: (rnd(3) - .5) * 50, delay: i * (REEL ? .1 : .13), fx: -900 - rnd(4) * 700, fr: -120 + rnd(5) * 240 });
  pile.appendChild(node);
}
const hookCap = el(`<div class="cap" style="z-index:40;left:0;right:0;text-align:center;top:${REEL ? 330 : 120}px;font-size:${REEL ? 96 : 88}px"></div>`);
stage.appendChild(hookCap);
function words(node, html) {
  html = html.replace(/<em>(.*?)<\/em>/g, (m, inner) => inner.split(' ').map((x) => `<em>${x}</em>`).join(' '));
  node.innerHTML = html.split('<br>').map((part) => part.replace(/(<em>)?([^\s<]+)(<\/em>)?/g, (m, a, w, b) => `<span class="w">${a || ''}${w}${b || ''}</span>`)).join('<br>');
}
words(hookCap, 'Hiring a <em>line cook?</em>');
const hookSub = el(`<div class="sub" style="z-index:40;left:0;right:0;text-align:center;top:${REEL ? 560 : 240}px;font-size:${REEL ? 44 : 40}px">Here comes the paperwork.</div>`);
stage.appendChild(hookSub);

// ---------- LOGO ----------
const logoL = el(`<div class="abs"><svg viewBox="3 8 24 24" width="100%" height="100%"><circle cx="15" cy="20" r="10" fill="none" stroke="#2E2A6B" stroke-width="4"/></svg></div>`);
const logoR = el(`<div class="abs"><svg viewBox="13 8 24 24" width="100%" height="100%"><circle cx="25" cy="20" r="10" fill="none" stroke="#7B8CF5" stroke-width="4"/></svg></div>`);
stage.appendChild(logoL); stage.appendChild(logoR);
const LS = REEL ? 300 : 240; // one ring's box size
const logoY = REEL ? 700 : 250;
const logoWord = el(`<div class="abs" style="left:0;right:0;text-align:center;top:${logoY + LS + 30}px;font-size:${REEL ? 84 : 72}px;font-weight:500;color:var(--indigo);letter-spacing:-.01em">staffkin</div>`);
stage.appendChild(logoWord);
const logoTag = el(`<div class="cap" style="left:0;right:0;text-align:center;top:${logoY + LS + (REEL ? 170 : 140)}px;font-size:${REEL ? 92 : 84}px"></div>`);
words(logoTag, REEL ? 'Hire people,<br> <em>not paperwork.</em>' : 'Hire people, <em>not paperwork.</em>');
stage.appendChild(logoTag);

// ---------- captions for app scenes ----------
const CAPS = {
  job: ['One job. <em>Everything ready.</em>', 'Job description, prescreen and interview guide in one click.'],
  pre: ['Prescreens by email. <em>Answers land here.</em>', 'Must-haves checked for you.'],
  score: ['Score every answer <em>the same way.</em>', 'Then compare side by side.'],
  refs: ['Reference checks <em>in one click.</em>', '$9 each. No subscription.'],
  hired: ['Hired. <em>Onboarding’s started.</em>', 'TD1, direct deposit, WHMIS, check-ins.'],
  tpl: ['Free templates <em>for 70 roles.</em>', 'Job descriptions, offer letters, interview questions.'],
};
const capNodes = {};
for (const [key, [c, s]] of Object.entries(CAPS)) {
  if (!S[key]) continue;
  const cap = el(`<div class="cap"></div>`), sub = el(`<div class="sub"></div>`);
  sub.textContent = s;
  if (REEL) {
    Object.assign(cap.style, { left: '90px', right: '90px', top: '230px', fontSize: '74px' });
    Object.assign(sub.style, { left: '92px', right: '90px', top: '0px', fontSize: '36px' });
  } else {
    Object.assign(cap.style, { left: '110px', width: '600px', top: '380px', fontSize: '74px' });
    Object.assign(sub.style, { left: '112px', width: '560px', top: '0px', fontSize: '32px', lineHeight: '1.3' });
  }
  words(cap, c);
  stage.appendChild(cap); stage.appendChild(sub);
  capNodes[key] = { cap, sub };
}

// ---------- the app panel ----------
const panelWrap = el(`<div id="panelWrap">${REEL ? '' : '<div class="chrome"><i></i><i></i><i></i><div class="url">staffkin.com/app</div></div>'}<div id="panel"></div></div>`);
stage.appendChild(panelWrap);
const panel = panelWrap.querySelector('#panel');
const PW = REEL ? 700 : 960, PH = REEL ? 700 : 720, CW = PW - 96; // panel design size and content width
panel.style.width = PW + 'px'; panel.style.height = PH + 'px';
if (!REEL) panelWrap.querySelector('.chrome').style.width = PW + 'px';
const PS = REEL ? 900 / PW : 1040 / PW; // panel scale
const PX = REEL ? 90 : 790, PY = REEL ? 560 : 150;
panel.appendChild(el(`<div class="apphead"><span class="brand"><span style="width:38px;height:27px;display:inline-block">${RINGS()}</span>staffkin</span><span class="nav on">Jobs</span><span class="nav">Settings</span><span class="pill">Free plan</span></div>`));
const scenes = {};
const addScene = (key, html) => { const s = el(`<div class="scene">${html}</div>`); panel.appendChild(s); scenes[key] = s; return s; };

// JOB: form, then the job with three ready cards
addScene('job', `
  <div id="jobForm" class="abs" style="inset:0">
    <div class="h1" style="left:48px;top:34px">New job</div>
    <div class="label" style="left:48px;top:118px">Job title</div>
    <div class="input focus" id="titleIn" style="left:48px;top:146px;width:${CW}px"><span id="typed"></span><span class="caret" id="caret"></span></div>
    <div class="label" style="left:48px;top:236px">Location</div>
    <div class="input" style="left:48px;top:264px;width:${CW}px">Kentville, NS</div>
    <div class="abs" style="left:48px;top:362px;display:flex;gap:16px;align-items:center;font-size:22px"><span class="check">${ICON.ok('#fff', 20)}</span>Set up a prescreen and an interview guide</div>
    <div class="abs" style="left:48px;top:414px;display:flex;gap:16px;align-items:center;font-size:22px"><span class="check">${ICON.ok('#fff', 20)}</span>Add the line cook job description</div>
    <div class="btn" id="createBtn" style="left:${48 + CW - 240}px;top:540px;width:240px;height:70px">Create job</div>
  </div>
  <div id="jobView" class="abs" style="inset:0">
    <div class="h1" style="left:48px;top:34px">Line cook</div>
    <div class="abs muted" style="left:50px;top:92px;font-size:20px">Kentville, NS · Created just now</div>
    <div class="card jc" style="left:48px;top:156px;width:${CW}px;height:132px"><span class="ico">${ICON.doc}</span><div><div class="t">Job description</div><div class="s">Line cook template, ready to edit</div></div><span class="tick">${ICON.ok()}</span></div>
    <div class="card jc" style="left:48px;top:310px;width:${CW}px;height:132px"><span class="ico">${ICON.clip}</span><div><div class="t">Prescreen</div><div class="s">8 questions, sent by email</div></div><span class="tick">${ICON.ok()}</span></div>
    <div class="card jc" style="left:48px;top:464px;width:${CW}px;height:132px"><span class="ico">${ICON.chart}</span><div><div class="t">Interview guide</div><div class="s">9 questions with a 1 to 5 scoring guide</div></div><span class="tick">${ICON.ok()}</span></div>
  </div>`);

// PRESCREEN answers
const CANDS = [['JS', 'Jordan S.', 'All must-haves met', 'good'], ['PK', 'Priya K.', 'All must-haves met', 'good'], ['ST', 'Sam T.', 'Check: weekends', 'warn']];
addScene('pre', `
