<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staffkin reference postcard, front</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E2A6B}a:hover{color:#23213F}
</style>
</helmet>
<div style="width: 816px; height: 1056px; background: #FFFFFF; font-family: Outfit, system-ui, sans-serif; color: #23213F; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); position: relative">
<sc-for list="{{copies}}" as="c" hint-placeholder-count="4">
<div style="width: 408px; height: 528px; box-sizing: border-box; padding: 40px 38px; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden">
<img src="/_blob/c16d331316db5d74af8231d1430645f3" alt="staffkin" style="height: 26px; width: 108px; display: block">
<h1 style="margin: 0; font-size: 32px; line-height: 1.1; font-weight: 600; color: #2E2A6B; letter-spacing: -0.01em">Checking references on a new hire?</h1>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
<li style="display: flex; gap: 12px; align-items: flex-start">
<span style="flex: 0 0 28px; height: 28px; border-radius: 50%; background: #EEF0FD; color: #2E2A6B; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center">1</span>
<span style="font-size: 16px; line-height: 1.35">The candidate agrees to the check.</span>
</li>
<li style="display: flex; gap: 12px; align-items: flex-start">
<span style="flex: 0 0 28px; height: 28px; border-radius: 50%; background: #EEF0FD; color: #2E2A6B; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center">2</span>
<span style="font-size: 16px; line-height: 1.35">Each referee gets the same short questions by email.</span>
</li>
<li style="display: flex; gap: 12px; align-items: flex-start">
<span style="flex: 0 0 28px; height: 28px; border-radius: 50%; background: #EEF0FD; color: #2E2A6B; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center">3</span>
<span style="font-size: 16px; line-height: 1.35">You get one PDF report back.</span>
</li>
</ol>
<div style="margin-top: auto; display: flex; gap: 14px; align-items: center; border-top: 2px solid #E1E3F2; padding-top: 14px">
<img src="/_blob/5347a7794130c861059da524b6c03e6d" alt="QR code to start a reference check on staffkin.com" style="width: 108px; height: 108px; display: block; flex: 0 0 108px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 24px; font-weight: 600; color: #2E2A6B; line-height: 1.1">$9 CAD a check</div>
<div style="font-size: 15px; color: #5F5C85">No subscription.</div>
<div style="font-size: 17px; font-weight: 600; color: #23213F; margin-top: 4px">staffkin.com</div>
</div>
</div>
</div>
</sc-for>
<div aria-hidden="true" style="position: absolute; left: 407px; top: 0; height: 1056px; border-left: 1px dashed #9C99BF"></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 527px; width: 816px; border-top: 1px dashed #9C99BF"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":816,"height":1056}}'>

return { copies: [{ id: 1 }, { id: 2 }, { id: 3 }, { id: 4 }] };
}

</body>
</html>
