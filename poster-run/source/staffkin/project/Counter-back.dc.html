<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staffkin counter card, back</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#23213F}a:hover{color:#23213F}
</style>
</helmet>
<div style="width: 816px; height: 1056px; background: #FFFFFF; font-family: Outfit, system-ui, sans-serif; color: #23213F; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); position: relative">
<sc-for list="{{copies}}" as="c" hint-placeholder-count="4">
<div style="width: 408px; height: 528px; box-sizing: border-box; padding: 52px 44px 48px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
<p style="margin: 0; font-size: 23px; line-height: 1.42; font-weight: 400; color: #23213F">Run the whole hire in one place: the job ad, interview questions with scoring, reference checks and a first-week checklist.</p>
<p style="margin: 0; font-size: 19px; line-height: 1.3; font-weight: 600; color: #23213F">Data stored in Canada.</p>
<div style="margin-top: auto; border-top: 1.5px solid #23213F; padding-top: 16px; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 30px; font-weight: 600; color: #23213F; line-height: 1.1">staffkin.com</div>
<div style="font-size: 17px; color: #23213F">contact@staffkin.com</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":816,"height":1056}}'>
class Component extends DCLogic {
renderVals() {
return { copies: [{ id: 1 }, { id: 2 }, { id: 3 }, { id: 4 }] };
}
}
</script>
</body>
</html>
